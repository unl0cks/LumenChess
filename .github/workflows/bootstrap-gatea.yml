name: Bootstrap Gate A Snapshot

on:
  push:
    branches:
      - gate-a-upload-final

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct and import snapshot
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .gate-a/chunk-000.bin \
            .gate-a/chunk-001.bin \
            .gate-a/chunk-002.bin \
            .gate-a/chunk-003.bin \
            .gate-a/chunk-004.bin \
            .gate-a/chunk-005.bin \
            .gate-a/chunk-006.bin \
            .gate-a/chunk-007.bin \
            .gate-a/chunk-008a.bin \
            .gate-a/chunk-008b.bin \
            > /tmp/LumenChess_M0-M5_GateA.zip
          actual="$(sha256sum /tmp/LumenChess_M0-M5_GateA.zip | awk '{print $1}')"
          expected="7341dddd527ffe8e6d2f1ac1514a4f59cceafea98bc5201685af925f9211d7d6"
          echo "actual=$actual"
          test "$actual" = "$expected"
          rm -rf /tmp/gatea
          mkdir -p /tmp/gatea
          unzip -q /tmp/LumenChess_M0-M5_GateA.zip -d /tmp/gatea
          cp -a /tmp/gatea/LumenChess_M0-M5_GateA/. .
          chmod +x gradlew
          rm -f .github/workflows/android.yml
          rm -rf .gate-a
          rm -f .github/workflows/bootstrap-gatea.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: import M0-M5 Gate A snapshot [skip ci]"
          git push origin HEAD:gate-a-upload-final
