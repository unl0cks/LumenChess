name: M24 public debug APK

on:
  push:
    branches: [codex/m24-imports-starting-positions]

permissions:
  contents: read

jobs:
  debug-apk:
    if: startsWith(github.event.head_commit.message, 'build(M24):')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 15859902
          packages: platform-tools
      - name: Install public build toolchain
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1" --channel=3
          rustup toolchain install 1.88.0 --profile minimal
          rustup target add --toolchain 1.88.0 aarch64-linux-android x86_64-linux-android
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble public debug APK
        run: ./gradlew :app:assembleDebug
      - name: Audit and fingerprint APK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import hashlib, json
          apk = Path('app/build/outputs/apk/debug/app-debug.apk')
          assert apk.is_file() and apk.stat().st_size > 0
          with ZipFile(apk) as z:
              names = z.namelist()
              bad = [n for n in names if 'chess.com-boards-and-pieces' in n.lower() or 'lumenpersonalassets' in n.lower() or n.lower().endswith(('.jks','.keystore'))]
              assert not bad, bad
          Path('m24-debug-apk.json').write_text(json.dumps({'sha256': hashlib.sha256(apk.read_bytes()).hexdigest(), 'bytes': apk.stat().st_size, 'name': apk.name, 'source': '${{ github.sha }}', 'privatePayloads': 0}, indent=2))
          PY
          cat m24-debug-apk.json
      - uses: actions/upload-artifact@v4
        with:
          name: m24-public-debug-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            m24-debug-apk.json
          retention-days: 14
