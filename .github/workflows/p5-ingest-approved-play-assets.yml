name: P5 ingest approved Play hero assets

on:
  push:
    branches:
      - p5-reference-fidelity-visual-identity
    paths:
      - .github/workflows/p5-ingest-approved-play-assets.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Fetch exact approved Play hero PNGs
        env:
          PLAY_URI: 'https://oaisdmntprnortheu.blob.core.windows.net/files/00000000-1fa4-81f4-80ca-e9d765093ef0/raw?se=2026-08-18T18%3A57%3A44Z&sp=r&sv=2026-02-06&sr=b&scid=01a01630-e9ff-7365-9d2b-25b4ec20c7df&skoid=a3a8eefe-d4bd-4909-ab1d-2a75a2302fac&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-18T08%3A32%3A25Z&ske=2026-08-19T08%3A32%3A25Z&sks=b&skv=2026-02-06&sig=I58HORJTdSvB0tWOxkS5d1w/EaG%2BapZpExev5uy8e1k%3D'
          ARENA_URI: 'https://oaisdmntprnortheu.blob.core.windows.net/files/00000000-7c20-81f4-8ac8-a2bbf5284b97/raw?se=2026-08-18T18%3A58%3A06Z&sp=r&sv=2026-02-06&sr=b&scid=01a01630-e9ff-7365-9d2b-25b4ec20c7df&skoid=a3a8eefe-d4bd-4909-ab1d-2a75a2302fac&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-18T07%3A38%3A12Z&ske=2026-08-19T07%3A38%3A12Z&sks=b&skv=2026-02-06&sig=6F6c%2B8%2B6IjxrdbgyPqgYYt%2B7%2Bg5C2MvVd44lmVoD8/o%3D'
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/play-overview
          curl --fail --location --retry 3 --retry-all-errors "$PLAY_URI" \
            --output app/src/main/assets/play-overview/lumen_play_vs_engine_hero.png
          curl --fail --location --retry 3 --retry-all-errors "$ARENA_URI" \
            --output app/src/main/assets/play-overview/lumen_engine_arena_hero.png
          cat > /tmp/p5-play-assets.sha256 <<'EOF'
          abdb0d1211553d329b8f7c48297ea484e254b68de0c296986a6fa0a113cecc3b  app/src/main/assets/play-overview/lumen_play_vs_engine_hero.png
          dfca04d2355f84c1f94eb905a07ffc8169a02841287e58f53ac20ee6b9af9180  app/src/main/assets/play-overview/lumen_engine_arena_hero.png
          EOF
          sha256sum --check /tmp/p5-play-assets.sha256
          python3 - <<'PY'
          from pathlib import Path
          import struct

          for name in (
              'lumen_play_vs_engine_hero.png',
              'lumen_engine_arena_hero.png',
          ):
              path = Path('app/src/main/assets/play-overview') / name
              data = path.read_bytes()
              assert data[:8] == b'\x89PNG\r\n\x1a\n', name
              width, height = struct.unpack('>II', data[16:24])
              assert (width, height) == (1254, 1254), (name, width, height)
              print(f'{name}: {width}x{height}, {len(data)} bytes')
          PY

      - name: Commit approved Play hero PNGs
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/assets/play-overview/lumen_play_vs_engine_hero.png \
                  app/src/main/assets/play-overview/lumen_engine_arena_hero.png
          git diff --cached --quiet && { echo 'Approved hero assets already present'; exit 0; }
          git commit -m 'assets(P5): package approved Play hero PNGs'
          git push origin HEAD:p5-reference-fidelity-visual-identity
