name: Android CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checkpoint:
    if: github.event_name == 'push' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 15859902
          packages: platform-tools
      - name: Install Android 17 build SDK
        run: |
          sdkmanager \
            "platforms;android-37.0" \
            "build-tools;36.0.0" \
            --channel=3
      - uses: gradle/actions/setup-gradle@v4
      - name: Run proportional JVM and engine-host checkpoint checks
        run: ./gradlew :core-chess:test :engine-api:test :engine-host:testDebugUnitTest :engine-host:lintDebug :engine-host:assembleDebug :engine-host:assembleDebugAndroidTest

  engine-device:
    if: >-
      github.event_name == 'push' &&
      github.ref != 'refs/heads/main' &&
      (startsWith(github.event.head_commit.message, 'checkpoint(M12):') ||
       startsWith(github.event.head_commit.message, 'checkpoint(M13):') ||
       startsWith(github.event.head_commit.message, 'checkpoint(M14):'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 15859902
          packages: platform-tools emulator
      - name: Install Android 17 test image
        run: |
          sdkmanager \
            "platforms;android-37.0" \
            "build-tools;36.0.0" \
            "system-images;android-37.0;google_apis_ps16k;x86_64" \
            --channel=3
      - uses: gradle/actions/setup-gradle@v4
      - name: Run focused engine-host lifecycle tests on Android 17
        run: |
          echo "no" | avdmanager create avd \
            --force \
            --name engine-checkpoint \
            --package "system-images;android-37.0;google_apis_ps16k;x86_64"

          emulator_bin="$ANDROID_HOME/emulator/emulator"
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
          "$emulator_bin" -accel-check || true
          "$emulator_bin" \
            -avd engine-checkpoint \
            -no-window -no-audio -no-boot-anim -no-snapshot \
            -gpu software -memory 4096 \
            > "$RUNNER_TEMP/engine-checkpoint-emulator.log" 2>&1 &
          emulator_pid=$!
          trap 'kill "$emulator_pid" 2>/dev/null || true' EXIT

          device_ready=0
          for _ in $(seq 1 45); do
            if ! kill -0 "$emulator_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/engine-checkpoint-emulator.log"
              exit 1
            fi
            if adb devices | grep -Eq '^emulator-[0-9]+[[:space:]]+device$'; then
              device_ready=1
              break
            fi
            sleep 2
          done
          if [ "$device_ready" -ne 1 ]; then
            cat "$RUNNER_TEMP/engine-checkpoint-emulator.log"
            exit 1
          fi
          timeout 240 bash -c 'until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = "1" ]; do sleep 2; done'
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0

          if ! ./gradlew :engine-host:connectedDebugAndroidTest; then
            echo "==== engine-host instrumentation reports ===="
            find engine-host/build -type f \( -name 'TEST-*.xml' -o -name '*.xml' \) -path '*androidTest-results*' -print -exec cat {} \; || true
            exit 1
          fi

  full:
    if: >-
      github.ref == 'refs/heads/main' ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'checkpoint(M15):'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 15859902
          packages: platform-tools emulator
      - name: Install Android 17 SDK, test image, and pinned NDK
        run: |
          sdkmanager \
            "platforms;android-37.0" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "system-images;android-37.0;google_apis_ps16k;x86_64" \
            --channel=3
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify cumulative JVM, Android modules, lint, and assemblies
        run: ./gradlew :core-chess:test :engine-api:test :engine-host:testDebugUnitTest :engine-host:lintDebug :engine-host:assembleDebug :engine-host:assembleDebugAndroidTest :data-persistence:testDebugUnitTest :data-persistence:lintDebug :data-persistence:assembleDebug :data-persistence:assembleDebugAndroidTest :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Verify committed Room schema history is up to date
        run: |
          schema_v1="data-persistence/schemas/dev.lumenchess.data.persistence.LumenDatabase/1.json"
          schema_v2="data-persistence/schemas/dev.lumenchess.data.persistence.LumenDatabase/2.json"
          test -f "$schema_v1"
          test -f "$schema_v2"
          git diff --exit-code -- data-persistence/schemas
          test -z "$(git status --porcelain --untracked-files=all -- data-persistence/schemas)"
      - name: Run cumulative instrumentation tests on Android 17
        run: |
          echo "no" | avdmanager create avd \
            --force \
            --name batch-gate \
            --package "system-images;android-37.0;google_apis_ps16k;x86_64"

          emulator_bin="$ANDROID_HOME/emulator/emulator"
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
          "$emulator_bin" -accel-check || true
          "$emulator_bin" \
            -avd batch-gate \
            -no-window -no-audio -no-boot-anim -no-snapshot \
            -gpu software -memory 4096 \
            > "$RUNNER_TEMP/batch-gate-emulator.log" 2>&1 &
          emulator_pid=$!
          trap 'kill "$emulator_pid" 2>/dev/null || true' EXIT

          device_ready=0
          for _ in $(seq 1 45); do
            if ! kill -0 "$emulator_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/batch-gate-emulator.log"
              exit 1
            fi
            if adb devices | grep -Eq '^emulator-[0-9]+[[:space:]]+device$'; then
              device_ready=1
              break
            fi
            sleep 2
          done
          if [ "$device_ready" -ne 1 ]; then
            cat "$RUNNER_TEMP/batch-gate-emulator.log"
            exit 1
          fi
          timeout 240 bash -c 'until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = "1" ]; do sleep 2; done'
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0

          if ! ./gradlew :engine-host:connectedDebugAndroidTest :data-persistence:connectedDebugAndroidTest :app:connectedDebugAndroidTest; then
            echo "==== Android instrumentation XML reports ===="
            find engine-host/build data-persistence/build app/build -type f \( -name 'TEST-*.xml' -o -name '*.xml' \) -path '*androidTest-results*' -print -exec cat {} \; || true
            exit 1
          fi
