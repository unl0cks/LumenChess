name: Android CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android 17 SDK and pinned NDK
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0" "ndk;28.2.13676358" --channel=3
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify Gate A
        run: ./gradlew :core-chess:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest
