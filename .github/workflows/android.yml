name: Android CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 15859902
          packages: platform-tools emulator
      - name: Install Android 17 SDK, test image, and pinned NDK
        run: |
          sdkmanager \
            "platforms;android-37.0" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "system-images;android-37.0;google_apis_ps16k;x86_64" \
            --channel=3
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify Gate A, chess core, Room module, lint, and assemblies
        run: ./gradlew :core-chess:test :data-persistence:testDebugUnitTest :data-persistence:lintDebug :data-persistence:assembleDebug :data-persistence:assembleDebugAndroidTest :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Run instrumentation tests on Android 17
        run: |
          echo "no" | avdmanager create avd \
            --force \
            --name gate-a \
            --package "system-images;android-37.0;google_apis_ps16k;x86_64"

          emulator_bin="$ANDROID_HOME/emulator/emulator"

          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
          fi
          "$emulator_bin" -accel-check || true

          "$emulator_bin" \
            -avd gate-a \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -no-snapshot \
            -gpu software \
            -memory 4096 \
            > "$RUNNER_TEMP/gate-a-emulator.log" 2>&1 &
          emulator_pid=$!

          device_ready=0
          for _ in $(seq 1 45); do
            if ! kill -0 "$emulator_pid" 2>/dev/null; then
              echo "Android Emulator exited before ADB became available."
              cat "$RUNNER_TEMP/gate-a-emulator.log"
              exit 1
            fi
            if adb devices | grep -Eq '^emulator-[0-9]+[[:space:]]+device$'; then
              device_ready=1
              break
            fi
            sleep 2
          done
          if [ "$device_ready" -ne 1 ]; then
            echo "Android Emulator did not become available to ADB within 90 seconds."
            cat "$RUNNER_TEMP/gate-a-emulator.log"
            exit 1
          fi

          if ! timeout 240 bash -c 'until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = "1" ]; do sleep 2; done'; then
            echo "Android Emulator did not finish booting within 240 seconds."
            cat "$RUNNER_TEMP/gate-a-emulator.log"
            exit 1
          fi

          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          ./gradlew :data-persistence:connectedDebugAndroidTest :app:connectedDebugAndroidTest
