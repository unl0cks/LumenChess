name: Android CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 15859902
          packages: platform-tools emulator
      - name: Install Android 17 SDK, test image, and pinned NDK
        run: |
          sdkmanager \
            "platforms;android-37.0" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "system-images;android-37.0;google_apis_ps16k;x86_64" \
            --channel=3
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify Gate A build and JVM tests
        run: ./gradlew :core-chess:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Run Compose instrumentation tests on Android 17
        run: |
          echo "no" | avdmanager create avd \
            --force \
            --name gate-a \
            --package "system-images;android-37.0;google_apis_ps16k;x86_64"

          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
          fi

          emulator \
            -avd gate-a \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -no-snapshot \
            -gpu swangle_indirect \
            -memory 4096 \
            > "$RUNNER_TEMP/gate-a-emulator.log" 2>&1 &

          adb wait-for-device
          timeout 240 bash -c 'until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = "1" ]; do sleep 2; done'
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          ./gradlew :app:connectedDebugAndroidTest
