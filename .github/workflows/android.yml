name: Android CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 15859902
      - name: Install Android 17 SDK and pinned NDK
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "ndk;28.2.13676358" --channel=3
      - name: Repair official Gradle wrapper once
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          bootstrap_dir="$(mktemp -d)"
          cd "$bootstrap_dir"
          printf 'rootProject.name = "wrapper-bootstrap"\n' > settings.gradle
          gradle wrapper --gradle-version 9.5.0 --distribution-type bin
          cp gradlew gradlew.bat "$GITHUB_WORKSPACE/"
          cp gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties "$GITHUB_WORKSPACE/gradle/wrapper/"
          cd "$GITHUB_WORKSPACE"
          if ! git diff --quiet -- gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
            git commit -m "fix: replace bootstrap with official Gradle wrapper"
            git push origin HEAD:main
          fi
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify Gate A
        run: ./gradlew :core-chess:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest
