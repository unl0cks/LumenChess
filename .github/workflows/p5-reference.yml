name: P5 Live Game reference

on:
  push:
    branches:
      - p5-reference-fidelity-visual-identity
    paths:
      - 'app/**'
      - '.github/workflows/p5-reference.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: p5-reference-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app-device:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mark P5 Live Game verification pending
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context='P5 reference/API37' \
            -f description='Live Game build, runtime redline and reference capture are running' \
            -f target_url="$RUN_URL"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 15859902
          packages: platform-tools emulator
      - name: Install Android 17 emulator and pinned native toolchain
        run: |
          sdkmanager \
            "platforms;android-37.0" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1" \
            "system-images;android-37.0;google_apis_ps16k;x86_64" \
            --channel=3
      - name: Install pinned Rust toolchain for Reckless 0.9.0
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup target add --toolchain 1.88.0 aarch64-linux-android x86_64-linux-android
      - uses: gradle/actions/setup-gradle@v4
      - name: Boot Pixel 8 Pro sized Android 17 emulator
        run: |
          echo "no" | avdmanager create avd --force --name p5-reference \
            --package "system-images;android-37.0;google_apis_ps16k;x86_64"
          AVD_CONFIG="$HOME/.android/avd/p5-reference.avd/config.ini"
          cat >> "$AVD_CONFIG" <<'EOF'
          hw.lcd.width=1344
          hw.lcd.height=2992
          hw.lcd.density=489
          showDeviceFrame=no
          EOF
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
          "$ANDROID_HOME/emulator/emulator" -avd p5-reference \
            -no-window -no-audio -no-boot-anim -no-snapshot -gpu software -memory 8192 \
            > "$RUNNER_TEMP/p5-emulator.log" 2>&1 &
          timeout 90 bash -c 'until adb devices | grep -Eq "^emulator-[0-9]+[[:space:]]+device$"; do sleep 2; done'
          timeout 240 bash -c 'until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = "1" ]; do sleep 2; done'
          adb shell wm size reset
          adb shell wm density reset
          SIZE="$(adb shell wm size | tr -d '\r')"
          DENSITY="$(adb shell wm density | tr -d '\r')"
          printf '%s\n%s\n' "$SIZE" "$DENSITY"
          grep -q 'Physical size: 1344x2992' <<< "$SIZE"
          grep -q 'Physical density: 489' <<< "$DENSITY"
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
      - name: Build Live Game screenshot APKs
        id: verify
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace \
            2>&1 | tee "$RUNNER_TEMP/p5-gradle-build.txt"
      - name: Surface Live Game build failure
        if: steps.verify.outcome != 'success'
        shell: bash
        run: |
          echo "::error title=P5 Live Game build::Screenshot APK build failed"
          tail -n 180 "$RUNNER_TEMP/p5-gradle-build.txt" || true
      - name: Capture Live Game, press state and comparison only
        id: screenshots
        if: steps.verify.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          adb install -r app/build/outputs/apk/debug/app-debug.apk
          adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          adb shell pm clear dev.lumenchess
          rm -rf p5-screenshots
          mkdir -p p5-screenshots
          adb shell am instrument -w -r \
            -e p5LiveQa true \
            -e class 'dev.lumenchess.visual.P5LiveScreenshotQaTest,dev.lumenchess.play.PlayUiIntegrationTest#boardBoundsStayStableAcrossHumanMoveEngineThinkingAndEngineResult' \
            dev.lumenchess.test/androidx.test.runner.AndroidJUnitRunner \
            | tee "$RUNNER_TEMP/p5-screenshot-instrumentation.txt"
          adb pull /sdcard/Android/data/dev.lumenchess/files/p5-screenshots/. p5-screenshots/
          COUNT="$(find p5-screenshots -type f -name '*.png' | wc -l | tr -d ' ')"
          if [ "$COUNT" != "2" ]; then
            echo "::error title=P5 Live Game screenshot::Expected exactly 2 device screenshots, found $COUNT"
            find p5-screenshots -maxdepth 2 -type f -print || true
            exit 1
          fi
          test -f p5-screenshots/02-stockfish-live.png
          test -f p5-screenshots/02-stockfish-live-press-state.png

          python3 -m pip install --quiet --disable-pip-version-check pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image

          root = Path('.')
          reference_path = root / 'docs/references/LumenChess_UI_Concept_Blue.png'
          candidate_path = root / 'p5-screenshots/02-stockfish-live.png'
          comparison_path = root / 'p5-screenshots/02-stockfish-live-comparison.png'

          # Tight measured crop of the complete workspace under "3. GAME PLAY SCREEN",
          # including the attached in-game action strip but excluding section heading/copy.
          reference = Image.open(reference_path).convert('RGB').crop((309, 451, 714, 1192))
          candidate = Image.open(candidate_path).convert('RGB')

          target_width = reference.width
          target_height = round(candidate.height * target_width / candidate.width)
          candidate = candidate.resize((target_width, target_height), Image.Resampling.LANCZOS)

          gap = 8
          canvas = Image.new(
              'RGB',
              (reference.width + gap + candidate.width, max(reference.height, candidate.height)),
              (8, 8, 8),
          )
          canvas.paste(reference, (0, 0))
          canvas.paste(candidate, (reference.width + gap, 0))
          canvas.save(comparison_path, optimize=True)

          assert reference.size == (405, 741), reference.size
          assert candidate.width == reference.width
          PY
          test -f p5-screenshots/02-stockfish-live-comparison.png
          FINAL_COUNT="$(find p5-screenshots -type f -name '*.png' | wc -l | tr -d ' ')"
          if [ "$FINAL_COUNT" != "3" ]; then
            echo "::error title=P5 Live Game artifact::Expected exactly 3 final PNGs, found $FINAL_COUNT"
            find p5-screenshots -maxdepth 2 -type f -print || true
            exit 1
          fi
          printf 'Captured real Stockfish live mainline, REST/PRESSED action and normalized reference comparison\n'
      - name: Upload Live Game screenshot artifact
        if: steps.verify.outcome == 'success' && steps.screenshots.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: p5-live-${{ github.sha }}
          path: |
            p5-screenshots/02-stockfish-live.png
            p5-screenshots/02-stockfish-live-comparison.png
            p5-screenshots/02-stockfish-live-press-state.png
          if-no-files-found: error
          retention-days: 14
      - name: Upload P5 diagnostics on failure
        if: always() && (steps.verify.outcome != 'success' || steps.screenshots.outcome != 'success')
        uses: actions/upload-artifact@v4
        with:
          name: p5-reference-diagnostics-${{ github.sha }}
          path: |
            ${{ runner.temp }}/p5-emulator.log
            ${{ runner.temp }}/p5-gradle-build.txt
            ${{ runner.temp }}/p5-screenshot-instrumentation.txt
            p5-screenshots/
            docs/references/LumenChess_UI_Concept_Blue.png
          if-no-files-found: warn
          retention-days: 7
      - name: Publish P5 Live Game verification success
        if: steps.verify.outcome == 'success' && steps.screenshots.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success \
            -f context='P5 reference/API37' \
            -f description='Live Game real-runtime capture, geometry regression and comparison passed' \
            -f target_url="$RUN_URL"
      - name: Publish P5 reference verification failure
        if: always() && (steps.verify.outcome != 'success' || steps.screenshots.outcome != 'success')
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=failure \
            -f context='P5 reference/API37' \
            -f description='Live Game build, runtime redline, capture or comparison failed' \
            -f target_url="$RUN_URL"
      - name: Fail workflow when P5 verification failed
        if: always() && (steps.verify.outcome != 'success' || steps.screenshots.outcome != 'success')
        run: exit 1
