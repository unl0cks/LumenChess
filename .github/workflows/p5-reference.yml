name: P5 reference fidelity

on:
  push:
    branches:
      - p5-reference-fidelity-visual-identity
    paths:
      - 'app/**'
      - '.github/workflows/p5-reference.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: p5-reference-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app-device:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mark P5 reference verification pending
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context='P5 reference/API37' \
            -f description='API37 reference verification and screenshot QA are running' \
            -f target_url="$RUN_URL"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 15859902
          packages: platform-tools emulator
      - name: Install Android 17 emulator and pinned native toolchain
        run: |
          sdkmanager \
            "platforms;android-37.0" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1" \
            "system-images;android-37.0;google_apis_ps16k;x86_64" \
            --channel=3
      - name: Install pinned Rust toolchain for Reckless 0.9.0
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup target add --toolchain 1.88.0 aarch64-linux-android x86_64-linux-android
      - uses: gradle/actions/setup-gradle@v4
      - name: Boot Pixel-sized Android 17 emulator
        run: |
          echo "no" | avdmanager create avd --force --name p5-reference \
            --package "system-images;android-37.0;google_apis_ps16k;x86_64"
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
          "$ANDROID_HOME/emulator/emulator" -avd p5-reference \
            -no-window -no-audio -no-boot-anim -no-snapshot -gpu software -memory 8192 \
            > "$RUNNER_TEMP/p5-emulator.log" 2>&1 &
          timeout 90 bash -c 'until adb devices | grep -Eq "^emulator-[0-9]+[[:space:]]+device$"; do sleep 2; done'
          timeout 240 bash -c 'until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = "1" ]; do sleep 2; done'
          adb shell wm size 1344x2992
          adb shell wm density 489
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
      - name: Run P5 app instrumentation
        id: verify
        continue-on-error: true
        run: ./gradlew :app:connectedDebugAndroidTest --stacktrace
      - name: Surface instrumentation failure details
        if: steps.verify.outcome != 'success'
        shell: bash
        run: |
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET

          reports = glob.glob('app/build/outputs/androidTest-results/**/*.xml', recursive=True)
          failures = 0
          for report in reports:
              try:
                  root = ET.parse(report).getroot()
              except (ET.ParseError, OSError) as error:
                  print(f"::warning title=Unreadable instrumentation report::{report}: {error}")
                  continue
              for case in root.iter('testcase'):
                  failure = case.find('failure')
                  if failure is None:
                      failure = case.find('error')
                  if failure is None:
                      continue
                  failures += 1
                  class_name = case.get('classname', 'unknown class')
                  name = case.get('name', 'unknown test')
                  detail = failure.get('message') or failure.text or 'Instrumentation test failed'
                  detail = ' '.join(detail.split())[:3000]
                  print(f"::error title=Instrumentation failure::{class_name}.{name}: {detail}")
          if not reports:
              print('::error title=Instrumentation diagnostics::No Android test XML reports were produced')
          elif failures == 0:
              print(f"::error title=Instrumentation diagnostics::{len(reports)} report(s) found but no failing testcase element was parsed")
          PY
      - name: Capture mandatory P5 Pixel screenshots
        id: screenshots
        if: steps.verify.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          adb install -r app/build/outputs/apk/debug/app-debug.apk
          adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          adb shell pm clear dev.lumenchess
          rm -rf p5-screenshots
          mkdir -p p5-screenshots
          adb shell am instrument -w -r \
            -e p5ScreenshotQa true \
            -e class dev.lumenchess.visual.P5ScreenshotQaTest \
            dev.lumenchess.test/androidx.test.runner.AndroidJUnitRunner \
            | tee "$RUNNER_TEMP/p5-screenshot-instrumentation.txt"
          adb pull /sdcard/Android/data/dev.lumenchess/files/p5-screenshots/. p5-screenshots/
          COUNT="$(find p5-screenshots -type f -name '*.png' | wc -l | tr -d ' ')"
          if [ "$COUNT" != "11" ]; then
            echo "::error title=P5 screenshot set::Expected 11 screenshots, found $COUNT"
            find p5-screenshots -maxdepth 2 -type f -print || true
            exit 1
          fi
          printf 'Captured %s mandatory screenshots\n' "$COUNT"
      - name: Upload P5 screenshot QA artifact
        if: steps.verify.outcome == 'success' && steps.screenshots.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: p5-reference-screenshots-${{ github.sha }}
          path: |
            p5-screenshots/
            docs/references/LumenChess_UI_Concept_Blue.png
            docs/references/REFERENCE-MANIFEST.md
            ${{ runner.temp }}/p5-screenshot-instrumentation.txt
          if-no-files-found: error
          retention-days: 14
      - name: Upload P5 diagnostics on failure
        if: always() && (steps.verify.outcome != 'success' || steps.screenshots.outcome != 'success')
        uses: actions/upload-artifact@v4
        with:
          name: p5-reference-diagnostics-${{ github.sha }}
          path: |
            ${{ runner.temp }}/p5-emulator.log
            ${{ runner.temp }}/p5-screenshot-instrumentation.txt
            p5-screenshots/
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
          if-no-files-found: warn
          retention-days: 7
      - name: Publish P5 reference verification success
        if: steps.verify.outcome == 'success' && steps.screenshots.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success \
            -f context='P5 reference/API37' \
            -f description='API37 reference verification and 11-state screenshot capture passed' \
            -f target_url="$RUN_URL"
      - name: Publish P5 reference verification failure
        if: always() && (steps.verify.outcome != 'success' || steps.screenshots.outcome != 'success')
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=failure \
            -f context='P5 reference/API37' \
            -f description='API37 reference verification or screenshot QA failed' \
            -f target_url="$RUN_URL"
      - name: Fail workflow when P5 verification failed
        if: always() && (steps.verify.outcome != 'success' || steps.screenshots.outcome != 'success')
        run: exit 1
