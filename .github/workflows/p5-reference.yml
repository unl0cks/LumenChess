name: P5 New Game + Play + Live + Settings reference

on:
  push:
    branches:
      - p5-reference-fidelity-visual-identity
    paths:
      - 'app/**'
      - 'docs/references/p5/.settings-iter3-approved-lossless*.b64'
      - 'docs/references/p5/play-overview-iter2/**'
      - 'docs/references/p5/new-game-approved/**'
      - 'docs/references/p5/live-approved/**'
      - '.github/workflows/p5-reference.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: p5-reference-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app-device:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mark P5 reference verification pending
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context='P5 reference/API37' \
            -f description='Approved New Game, Play, Live and Settings translations and focused regressions are running' \
            -f target_url="$RUN_URL"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 15859902
          packages: platform-tools emulator
      - name: Install Android 17 emulator and pinned native toolchain
        run: |
          sdkmanager \
            "platforms;android-37.0" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1" \
            "system-images;android-37.0;google_apis_ps16k;x86_64" \
            --channel=3
      - name: Install pinned Rust toolchain for Reckless 0.9.0
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup target add --toolchain 1.88.0 aarch64-linux-android x86_64-linux-android
      - uses: gradle/actions/setup-gradle@v4
      - name: Boot Pixel 8 Pro sized Android 17 emulator
        run: |
          echo "no" | avdmanager create avd --force --name p5-reference \
            --package "system-images;android-37.0;google_apis_ps16k;x86_64"
          AVD_CONFIG="$HOME/.android/avd/p5-reference.avd/config.ini"
          cat >> "$AVD_CONFIG" <<'AVDEOF'
          hw.lcd.width=1344
          hw.lcd.height=2992
          hw.lcd.density=489
          showDeviceFrame=no
          AVDEOF
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
          "$ANDROID_HOME/emulator/emulator" -avd p5-reference \
            -no-window -no-audio -no-boot-anim -no-snapshot -gpu software -memory 8192 \
            > "$RUNNER_TEMP/p5-emulator.log" 2>&1 &
          timeout 90 bash -c 'until adb devices | grep -Eq "^emulator-[0-9]+[[:space:]]+device$"; do sleep 2; done'
          timeout 240 bash -c 'until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = "1" ]; do sleep 2; done'
          adb shell wm size reset
          adb shell wm density reset
          SIZE="$(adb shell wm size | tr -d '\r')"
          DENSITY="$(adb shell wm density | tr -d '\r')"
          printf '%s\n%s\n' "$SIZE" "$DENSITY"
          grep -q 'Physical size: 1344x2992' <<< "$SIZE"
          grep -q 'Physical density: 489' <<< "$DENSITY"
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
      - name: Build P5 reference screenshot APKs and focused setup tests
        id: verify
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest :app:testDebugUnitTest \
            --tests 'dev.lumenchess.play.PlaySetupConfigTest' \
            --tests 'dev.lumenchess.play.PlayRuntimeCoordinatorTest' \
            --tests 'dev.lumenchess.play.PlaySnapshotCodecTest' \
            --tests 'dev.lumenchess.feedback.GameFeedbackProjectorTest' \
            --stacktrace \
            2>&1 | tee "$RUNNER_TEMP/p5-gradle-build.txt"
      - name: Surface P5 build failure
        if: steps.verify.outcome != 'success'
        shell: bash
        run: |
          echo "::error title=P5 reference build::Screenshot APK build or focused setup tests failed"
          tail -n 180 "$RUNNER_TEMP/p5-gradle-build.txt" || true
      - name: Capture approved Settings, Play, New Game, Live, press states and regressions
        id: screenshots
        if: steps.verify.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          adb install -r app/build/outputs/apk/debug/app-debug.apk
          adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          adb shell pm clear dev.lumenchess
          rm -rf p5-screenshots p5-reference-render
          mkdir -p p5-screenshots p5-reference-render

          adb shell am instrument -w -r \
            -e p5SettingsQa true \
            -e class 'dev.lumenchess.visual.P5SettingsScreenshotQaTest#captureSettingsRootReferenceOnly' \
            dev.lumenchess.test/androidx.test.runner.AndroidJUnitRunner \
            | tee "$RUNNER_TEMP/p5-settings-instrumentation.txt"
          adb pull /sdcard/Android/data/dev.lumenchess/files/p5-screenshots/. p5-screenshots/

          # The P1 lane intentionally starts a game. Clear it so the frozen board-first Live
          # reference always begins from the default Human-vs-Engine setup.
          adb shell pm clear dev.lumenchess

          adb shell am instrument -w -r \
            -e p5LiveQa true \
            -e class 'dev.lumenchess.visual.P5LiveScreenshotQaTest' \
            dev.lumenchess.test/androidx.test.runner.AndroidJUnitRunner \
            | tee "$RUNNER_TEMP/p5-live-instrumentation.txt"
          adb pull /sdcard/Android/data/dev.lumenchess/files/p5-screenshots/. p5-screenshots/

          # Behavioral coverage gets its own fresh state; it must not affect deterministic
          # reference pixels captured above or the Play Overview capture below.
          adb shell pm clear dev.lumenchess
          adb shell am instrument -w -r \
            -e class 'dev.lumenchess.play.PlayUiIntegrationTest,dev.lumenchess.play.PlayM19IntegrationTest' \
            dev.lumenchess.test/androidx.test.runner.AndroidJUnitRunner \
            | tee "$RUNNER_TEMP/p5-live-runtime-instrumentation.txt"

          adb shell pm clear dev.lumenchess
          adb shell am instrument -w -r \
            -e p5PlayOverviewQa true \
            -e class 'dev.lumenchess.visual.P5PlayOverviewScreenshotQaTest' \
            dev.lumenchess.test/androidx.test.runner.AndroidJUnitRunner \
            | tee "$RUNNER_TEMP/p5-play-instrumentation.txt"
          adb pull /sdcard/Android/data/dev.lumenchess/files/p5-screenshots/. p5-screenshots/

          # The preceding P1 lane deliberately starts/persists a game. Isolate the frozen
          # New Game reference state without changing production resume behavior.
          adb shell pm clear dev.lumenchess

          adb shell am instrument -w -r \
            -e p5SetupQa true \
            -e class 'dev.lumenchess.visual.P5SetupScreenshotQaTest' \
            dev.lumenchess.test/androidx.test.runner.AndroidJUnitRunner \
            | tee "$RUNNER_TEMP/p5-setup-instrumentation.txt"

          adb pull /sdcard/Android/data/dev.lumenchess/files/p5-screenshots/. p5-screenshots/
          COUNT="$(find p5-screenshots -type f -name '*.png' | wc -l | tr -d ' ')"
          if [ "$COUNT" != "8" ]; then
            echo "::error title=P5 screenshots::Expected exactly 8 device screenshots, found $COUNT"
            find p5-screenshots -maxdepth 2 -type f -print || true
            exit 1
          fi
          test -f p5-screenshots/04-settings.png
          test -f p5-screenshots/04-settings-press-state.png
          test -f p5-screenshots/01-play-overview.png
          test -f p5-screenshots/01-play-overview-press-state.png
          test -f p5-screenshots/02-new-game.png
          test -f p5-screenshots/02-new-game-press-state.png
          test -f p5-screenshots/03-live.png
          test -f p5-screenshots/03-live-press-state.png

          python3 -m pip install --quiet --disable-pip-version-check pillow playwright

          python3 - <<'PY'
          import base64
          import hashlib
          import io
          from pathlib import Path
          from PIL import Image

          root = Path('.')
          prefix = root / 'docs/references/p5'
          candidate_path = root / 'p5-screenshots/04-settings.png'
          comparison_path = root / 'p5-screenshots/04-settings-approved-comparison.png'
          paths = [
              prefix / '.settings-iter3-approved-lossless.part00.b64',
              prefix / '.settings-iter3-approved-lossless.part01.b64',
              prefix / '.settings-iter3-approved-lossless.part02.b64',
              prefix / '.settings-iter3-approved-lossless.part03.b64',
              *[prefix / f'.settings-iter3-approved-lossless.part04.{i:02d}.b64' for i in range(6)],
              *[prefix / f'.settings-iter3-approved-lossless.part05.{i:02d}.b64' for i in range(6)],
              prefix / '.settings-iter3-approved-lossless.part06.b64',
              prefix / '.settings-iter3-approved-lossless.part07.b64',
          ]
          reference_b64 = ''.join(path.read_text().strip() for path in paths)
          assert len(reference_b64) == 85352, len(reference_b64)
          reference_bytes = base64.b64decode(reference_b64, validate=True)
          assert hashlib.sha256(reference_bytes).hexdigest() == '9fcfa2a94fbcf635c7d5b0dec3c1ae3af955a87377272350f18367c2d2842fca'
          reference = Image.open(io.BytesIO(reference_bytes)).convert('RGB')
          assert reference.size == (390, 844), reference.size
          assert hashlib.sha256(reference.tobytes()).hexdigest() == '791a5d6cac599e83a3083d369b42e2c39b09099cc59033255d6360b0ad906452'
          candidate = Image.open(candidate_path).convert('RGB')
          target_aspect = reference.width / reference.height
          crop_height = round(candidate.width / target_aspect)
          assert crop_height <= candidate.height, (candidate.size, crop_height)
          candidate = candidate.crop((0, candidate.height - crop_height, candidate.width, candidate.height)).resize(reference.size, Image.Resampling.LANCZOS)
          gap = 10
          canvas = Image.new('RGB', (reference.width + gap + candidate.width, reference.height), (5, 7, 9))
          canvas.paste(reference, (0, 0)); canvas.paste(candidate, (reference.width + gap, 0))
          canvas.save(comparison_path, optimize=True)
          PY
          test -f p5-screenshots/04-settings-approved-comparison.png

          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$BROWSER" ]; then
            echo "::error title=P5 reference::No system Chromium/Chrome executable available"
            exit 1
          fi
          P5_BROWSER="$BROWSER" python3 docs/references/p5/play-overview-iter2/render_reference.py \
            p5-reference-render/01-play-overview-approved-reference.png \
            | tee "$RUNNER_TEMP/p5-play-reference.txt"
          P5_BROWSER="$BROWSER" python3 docs/references/p5/new-game-approved/render_reference.py \
            p5-reference-render/02-new-game-approved-reference.png \
            | tee "$RUNNER_TEMP/p5-new-game-reference.txt"

          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image

          root = Path('.')
          def compare(reference_name, candidate_name, output_name):
              reference = Image.open(root / reference_name).convert('RGB')
              assert reference.size == (390, 844), reference.size
              candidate = Image.open(root / candidate_name).convert('RGB')
              target_aspect = reference.width / reference.height
              crop_height = round(candidate.width / target_aspect)
              assert crop_height <= candidate.height, (candidate.size, crop_height)
              candidate = candidate.crop((0, candidate.height - crop_height, candidate.width, candidate.height)).resize(reference.size, Image.Resampling.LANCZOS)
              gap = 10
              canvas = Image.new('RGB', (reference.width + gap + candidate.width, reference.height), (5, 7, 9))
              canvas.paste(reference, (0, 0)); canvas.paste(candidate, (reference.width + gap, 0))
              canvas.save(root / output_name, optimize=True)

          compare('p5-reference-render/01-play-overview-approved-reference.png', 'p5-screenshots/01-play-overview.png', 'p5-screenshots/01-play-overview-approved-comparison.png')
          compare('p5-reference-render/02-new-game-approved-reference.png', 'p5-screenshots/02-new-game.png', 'p5-screenshots/02-new-game-approved-comparison.png')

          live_reference_path = root / 'docs/references/p5/live-approved/03-live-board-first-approved.png'
          live_reference_bytes = live_reference_path.read_bytes()
          import hashlib
          assert hashlib.sha256(live_reference_bytes).hexdigest() == 'ae30bd1dc538416d742a22190cce731ccaed3ef9d624dfcda224bf3b3572f157'
          live_reference = Image.open(live_reference_path).convert('RGB')
          assert live_reference.size == (390, 844), live_reference.size
          assert hashlib.sha256(live_reference.tobytes()).hexdigest() == '2511adbe04c860cb5cffa2077336fbe029b35e54a33d8d942d8c86cb03136c37'
          compare('docs/references/p5/live-approved/03-live-board-first-approved.png', 'p5-screenshots/03-live.png', 'p5-screenshots/03-live-approved-comparison.png')
          PY
          test -f p5-screenshots/01-play-overview-approved-comparison.png
          test -f p5-screenshots/02-new-game-approved-comparison.png
          test -f p5-screenshots/03-live-approved-comparison.png

          FINAL_COUNT="$(find p5-screenshots -type f -name '*.png' | wc -l | tr -d ' ')"
          if [ "$FINAL_COUNT" != "12" ]; then
            echo "::error title=P5 artifacts::Expected exactly 12 final screenshot PNGs, found $FINAL_COUNT"
            find p5-screenshots -maxdepth 2 -type f -print || true
            exit 1
          fi
          printf 'Captured approved Settings + Play + New Game + Live REST/PRESSED states and focused Play/Live/P1 regressions\n'
      - name: Upload Settings screenshot artifact
        if: steps.verify.outcome == 'success' && steps.screenshots.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: p5-settings-${{ github.sha }}
          path: |
            p5-screenshots/04-settings.png
            p5-screenshots/04-settings-approved-comparison.png
            p5-screenshots/04-settings-press-state.png
          if-no-files-found: error
          retention-days: 14
      - name: Upload Play Overview screenshot artifact
        if: steps.verify.outcome == 'success' && steps.screenshots.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: p5-play-overview-${{ github.sha }}
          path: |
            p5-screenshots/01-play-overview.png
            p5-screenshots/01-play-overview-approved-comparison.png
            p5-screenshots/01-play-overview-press-state.png
          if-no-files-found: error
          retention-days: 14
      - name: Upload New Game screenshot artifact
        if: steps.verify.outcome == 'success' && steps.screenshots.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: p5-new-game-${{ github.sha }}
          path: |
            p5-screenshots/02-new-game.png
            p5-screenshots/02-new-game-approved-comparison.png
            p5-screenshots/02-new-game-press-state.png
          if-no-files-found: error
          retention-days: 14
      - name: Upload Live screenshot artifact
        if: steps.verify.outcome == 'success' && steps.screenshots.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: p5-live-${{ github.sha }}
          path: |
            p5-screenshots/03-live.png
            p5-screenshots/03-live-approved-comparison.png
            p5-screenshots/03-live-press-state.png
          if-no-files-found: error
          retention-days: 14
      - name: Upload P5 diagnostics on failure
        if: always() && (steps.verify.outcome != 'success' || steps.screenshots.outcome != 'success')
        uses: actions/upload-artifact@v4
        with:
          name: p5-reference-diagnostics-${{ github.sha }}
          path: |
            ${{ runner.temp }}/p5-emulator.log
            ${{ runner.temp }}/p5-gradle-build.txt
            ${{ runner.temp }}/p5-settings-instrumentation.txt
            ${{ runner.temp }}/p5-live-instrumentation.txt
            ${{ runner.temp }}/p5-live-runtime-instrumentation.txt
            ${{ runner.temp }}/p5-play-instrumentation.txt
            ${{ runner.temp }}/p5-setup-instrumentation.txt
            ${{ runner.temp }}/p5-play-reference.txt
            ${{ runner.temp }}/p5-new-game-reference.txt
            p5-screenshots/
            p5-reference-render/
          if-no-files-found: warn
          retention-days: 7
      - name: Publish P5 reference verification success
        if: steps.verify.outcome == 'success' && steps.screenshots.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success \
            -f context='P5 reference/API37' \
            -f description='Approved New Game + Play + Live + Settings, setup behavior/press QA, Live board-first and P1 geometry passed' \
            -f target_url="$RUN_URL"
      - name: Publish P5 reference verification failure
        if: always() && (steps.verify.outcome != 'success' || steps.screenshots.outcome != 'success')
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=failure \
            -f context='P5 reference/API37' \
            -f description='Approved New Game/Play/Live/Settings build, screenshot QA, behavior, Live presentation or geometry failed' \
            -f target_url="$RUN_URL"
      - name: Fail workflow when P5 verification failed
        if: always() && (steps.verify.outcome != 'success' || steps.screenshots.outcome != 'success')
        run: exit 1
