name: P5 reference fidelity

on:
  push:
    branches:
      - p5-reference-fidelity-visual-identity
    paths:
      - 'app/**'
      - '.github/workflows/p5-reference.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: p5-reference-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app-device:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Verify exact source SHA
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code
      - name: Mark P5 reference verification pending
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context='P5 reference/API37' \
            -f description='P5 visual QA, cumulative gate, and ARM64 build are running' \
            -f target_url="$RUN_URL"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 15859902
          packages: platform-tools emulator
      - name: Install Android 17 emulator and pinned native toolchain
        run: |
          sdkmanager \
            "platforms;android-37.0" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1" \
            "system-images;android-37.0;google_apis_ps16k;x86_64" \
            --channel=3
      - name: Install pinned Rust toolchain for Reckless 0.9.0
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup target add --toolchain 1.88.0 aarch64-linux-android x86_64-linux-android
          rustup run 1.88.0 rustc --version
      - uses: gradle/actions/setup-gradle@v4
      - name: Boot Pixel 8 Pro sized Android 17 emulator
        run: |
          echo "no" | avdmanager create avd --force --name p5-reference \
            --package "system-images;android-37.0;google_apis_ps16k;x86_64"
          AVD_CONFIG="$HOME/.android/avd/p5-reference.avd/config.ini"
          cat >> "$AVD_CONFIG" <<'EOF'
          hw.lcd.width=1344
          hw.lcd.height=2992
          hw.lcd.density=489
          showDeviceFrame=no
          EOF
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
          "$ANDROID_HOME/emulator/emulator" -avd p5-reference \
            -no-window -no-audio -no-boot-anim -no-snapshot -gpu software -memory 8192 \
            > "$RUNNER_TEMP/p5-emulator.log" 2>&1 &
          timeout 90 bash -c 'until adb devices | grep -Eq "^emulator-[0-9]+[[:space:]]+device$"; do sleep 2; done'
          timeout 240 bash -c 'until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = "1" ]; do sleep 2; done'
          adb shell wm size reset
          adb shell wm density reset
          SIZE="$(adb shell wm size | tr -d '\r')"
          DENSITY="$(adb shell wm density | tr -d '\r')"
          printf '%s\n%s\n' "$SIZE" "$DENSITY"
          grep -q 'Physical size: 1344x2992' <<< "$SIZE"
          grep -q 'Physical density: 489' <<< "$DENSITY"
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          echo "Device page size: $(adb shell getconf PAGESIZE | tr -d '\r')"
      - name: Run proportional P5 app instrumentation
        id: verify
        continue-on-error: true
        run: ./gradlew :app:connectedDebugAndroidTest --stacktrace
      - name: Surface instrumentation failure details
        if: steps.verify.outcome != 'success'
        shell: bash
        run: |
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET

          reports = glob.glob('app/build/outputs/androidTest-results/**/*.xml', recursive=True)
          failures = 0
          for report in reports:
              try:
                  root = ET.parse(report).getroot()
              except (ET.ParseError, OSError) as error:
                  print(f"::warning title=Unreadable instrumentation report::{report}: {error}")
                  continue
              for case in root.iter('testcase'):
                  failure = case.find('failure')
                  if failure is None:
                      failure = case.find('error')
                  if failure is None:
                      continue
                  failures += 1
                  class_name = case.get('classname', 'unknown class')
                  name = case.get('name', 'unknown test')
                  detail = failure.get('message') or failure.text or 'Instrumentation test failed'
                  detail = ' '.join(detail.split())[:3000]
                  print(f"::error title=Instrumentation failure::{class_name}.{name}: {detail}")
          if not reports:
              print('::error title=Instrumentation diagnostics::No Android test XML reports were produced')
          elif failures == 0:
              print(f"::error title=Instrumentation diagnostics::{len(reports)} report(s) found but no failing testcase element was parsed")
          PY
      - name: Capture mandatory P5 Pixel screenshots
        id: screenshots
        if: steps.verify.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          adb install -r app/build/outputs/apk/debug/app-debug.apk
          adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          adb shell pm clear dev.lumenchess
          rm -rf p5-screenshots
          mkdir -p p5-screenshots
          adb shell am instrument -w -r \
            -e p5ScreenshotQa true \
            -e class dev.lumenchess.visual.P5ScreenshotQaTest \
            dev.lumenchess.test/androidx.test.runner.AndroidJUnitRunner \
            | tee "$RUNNER_TEMP/p5-screenshot-instrumentation.txt"
          adb pull /sdcard/Android/data/dev.lumenchess/files/p5-screenshots/. p5-screenshots/
          COUNT="$(find p5-screenshots -type f -name '*.png' | wc -l | tr -d ' ')"
          if [ "$COUNT" != "11" ]; then
            echo "::error title=P5 screenshot set::Expected 11 screenshots, found $COUNT"
            find p5-screenshots -maxdepth 2 -type f -print || true
            exit 1
          fi
          for image in p5-screenshots/*.png; do
            file "$image" | grep -q '1344 x 2992'
          done
          printf 'Captured %s mandatory 1344x2992 screenshots\n' "$COUNT"
      - name: Upload P5 screenshot QA artifact
        id: screenshot_artifact
        if: steps.verify.outcome == 'success' && steps.screenshots.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: p5-reference-screenshots-${{ github.sha }}
          path: |
            p5-screenshots/
            docs/references/LumenChess_UI_Concept_Blue.png
            docs/references/REFERENCE-MANIFEST.md
            ${{ runner.temp }}/p5-screenshot-instrumentation.txt
          if-no-files-found: error
          retention-days: 14
      - name: Verify cumulative M0-M19 and P1-P5 JVM, lint, and assemblies
        id: gate_jvm
        if: steps.verify.outcome == 'success' && steps.screenshots.outcome == 'success' && steps.screenshot_artifact.outcome == 'success'
        continue-on-error: true
        run: >-
          ./gradlew
          :core-chess:test
          :game-runtime:test
          :engine-api:test
          :engine-host:testDebugUnitTest
          :engine-host:lintDebug
          :engine-host:assembleDebug
          :engine-host:assembleDebugAndroidTest
          :data-persistence:testDebugUnitTest
          :data-persistence:lintDebug
          :data-persistence:assembleDebug
          :data-persistence:assembleDebugAndroidTest
          :app:testDebugUnitTest
          :app:lintDebug
          :app:assembleDebug
          :app:assembleDebugAndroidTest
      - name: Verify native engine ABIs and 16 KiB ELF alignment
        id: gate_native
        if: steps.gate_jvm.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          readelf="$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          test -x "$readelf"
          for engine in lumen_stockfish18 lumen_reckless09; do
            for abi in arm64-v8a x86_64; do
              lib="$(find engine-host/build -type f -path "*/${abi}/lib${engine}.so" | head -n 1)"
              test -n "$lib"
              echo "Verifying $engine $abi: $lib"
              python - "$readelf" "$lib" <<'PY'
          import subprocess
          import sys
          readelf, library = sys.argv[1:]
          output = subprocess.check_output([readelf, "-lW", library], text=True)
          aligns = [
              int(line.split()[-1], 0)
              for line in output.splitlines()
              if line.lstrip().startswith("LOAD")
          ]
          if not aligns:
              raise SystemExit(f"No PT_LOAD segments found in {library}")
          if any(align < 0x4000 for align in aligns):
              raise SystemExit(f"{library} has LOAD alignment below 16 KiB: {aligns}")
          print(f"LOAD alignments: {aligns}")
          PY
            done
          done
      - name: Verify committed Room schema history is up to date
        id: gate_room
        if: steps.gate_jvm.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          schema_v1="data-persistence/schemas/dev.lumenchess.data.persistence.LumenDatabase/1.json"
          schema_v2="data-persistence/schemas/dev.lumenchess.data.persistence.LumenDatabase/2.json"
          test -f "$schema_v1"
          test -f "$schema_v2"
          git diff --exit-code -- data-persistence/schemas
          test -z "$(git status --porcelain --untracked-files=all -- data-persistence/schemas)"
      - name: Run cumulative engine, persistence, and app instrumentation on API37
        id: gate_device
        if: steps.gate_jvm.outcome == 'success' && steps.gate_native.outcome == 'success' && steps.gate_room.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          ./gradlew \
            :engine-host:connectedDebugAndroidTest \
            :data-persistence:connectedDebugAndroidTest \
            :app:connectedDebugAndroidTest \
            --stacktrace
      - name: Upload cumulative Gate P5 instrumentation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-p5-instrumentation-${{ github.sha }}
          path: |
            engine-host/build/outputs/androidTest-results/
            engine-host/build/reports/androidTests/
            data-persistence/build/outputs/androidTest-results/
            data-persistence/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
          if-no-files-found: warn
          retention-days: 14
      - name: Build exact-SHA ARM64-only Pixel 8 Pro debug APK
        id: apk
        if: >-
          steps.gate_jvm.outcome == 'success' &&
          steps.gate_native.outcome == 'success' &&
          steps.gate_room.outcome == 'success' &&
          steps.gate_device.outcome == 'success'
        continue-on-error: true
        run: ./gradlew :app:clean :engine-host:clean :app:assembleDebug -PlumenPhysicalArm64Only=true
      - name: Inspect and package exact-SHA ARM64 APK
        id: package_apk
        if: steps.apk.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' | head -n 1)"
          test -n "$apk"
          out="$RUNNER_TEMP/pixel-arm64"
          mkdir -p "$out"
          name="LumenChess-Pixel8Pro-${GITHUB_SHA:0:8}-debug.apk"
          cp "$apk" "$out/$name"

          unzip -t "$out/$name"
          unzip -l "$out/$name" > "$out/apk-entries.txt"
          grep -q 'lib/arm64-v8a/liblumen_stockfish18.so' "$out/apk-entries.txt"
          grep -q 'lib/arm64-v8a/liblumen_reckless09.so' "$out/apk-entries.txt"
          if grep -Eq 'lib/(x86_64|x86|armeabi-v7a)/' "$out/apk-entries.txt"; then
            echo "Non-ARM64 native payload found in physical APK"
            grep -E 'lib/(x86_64|x86|armeabi-v7a)/' "$out/apk-entries.txt"
            exit 1
          fi

          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$out/$name" > "$out/aapt-badging.txt"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$out/$name" > "$out/apksigner.txt"
          sha256sum "$out/$name" > "$out/SHA256SUMS.txt"
          printf 'source_sha=%s\nfilename=%s\n' "$GITHUB_SHA" "$name" > "$out/build-metadata.txt"
          python scripts/report-apk-size.py "$out/$name" \
            --budget-mib 230 \
            --json-output "$out/arm64-debug-size.json" \
            --markdown-output "$out/arm64-debug-size.md"
      - name: Upload exact-SHA Pixel 8 Pro ARM64 APK
        id: apk_artifact
        if: steps.package_apk.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: lumenchess-pixel8pro-arm64-${{ github.sha }}
          path: ${{ runner.temp }}/pixel-arm64
          if-no-files-found: error
          retention-days: 30
      - name: Upload P5 diagnostics on failure
        if: >-
          always() &&
          (steps.verify.outcome != 'success' ||
           steps.screenshots.outcome != 'success' ||
           steps.screenshot_artifact.outcome != 'success' ||
           steps.gate_jvm.outcome != 'success' ||
           steps.gate_native.outcome != 'success' ||
           steps.gate_room.outcome != 'success' ||
           steps.gate_device.outcome != 'success' ||
           steps.apk.outcome != 'success' ||
           steps.package_apk.outcome != 'success' ||
           steps.apk_artifact.outcome != 'success')
        uses: actions/upload-artifact@v4
        with:
          name: p5-reference-diagnostics-${{ github.sha }}
          path: |
            ${{ runner.temp }}/p5-emulator.log
            ${{ runner.temp }}/p5-screenshot-instrumentation.txt
            ${{ runner.temp }}/pixel-arm64/
            p5-screenshots/
            docs/references/LumenChess_UI_Concept_Blue.png
            docs/references/REFERENCE-MANIFEST.md
            engine-host/build/outputs/androidTest-results/
            engine-host/build/reports/androidTests/
            data-persistence/build/outputs/androidTest-results/
            data-persistence/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
          if-no-files-found: warn
          retention-days: 7
      - name: Publish P5 completion success
        if: >-
          steps.verify.outcome == 'success' &&
          steps.screenshots.outcome == 'success' &&
          steps.screenshot_artifact.outcome == 'success' &&
          steps.gate_jvm.outcome == 'success' &&
          steps.gate_native.outcome == 'success' &&
          steps.gate_room.outcome == 'success' &&
          steps.gate_device.outcome == 'success' &&
          steps.apk.outcome == 'success' &&
          steps.package_apk.outcome == 'success' &&
          steps.apk_artifact.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success \
            -f context='P5 reference/API37' \
            -f description='P5 visual QA, cumulative gate, and ARM64 build passed' \
            -f target_url="$RUN_URL"
      - name: Publish P5 completion failure
        if: >-
          always() &&
          (steps.verify.outcome != 'success' ||
           steps.screenshots.outcome != 'success' ||
           steps.screenshot_artifact.outcome != 'success' ||
           steps.gate_jvm.outcome != 'success' ||
           steps.gate_native.outcome != 'success' ||
           steps.gate_room.outcome != 'success' ||
           steps.gate_device.outcome != 'success' ||
           steps.apk.outcome != 'success' ||
           steps.package_apk.outcome != 'success' ||
           steps.apk_artifact.outcome != 'success')
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=failure \
            -f context='P5 reference/API37' \
            -f description='P5 visual QA, cumulative gate, or ARM64 build failed' \
            -f target_url="$RUN_URL"
      - name: Fail workflow when P5 completion gate failed
        if: >-
          always() &&
          (steps.verify.outcome != 'success' ||
           steps.screenshots.outcome != 'success' ||
           steps.screenshot_artifact.outcome != 'success' ||
           steps.gate_jvm.outcome != 'success' ||
           steps.gate_native.outcome != 'success' ||
           steps.gate_room.outcome != 'success' ||
           steps.gate_device.outcome != 'success' ||
           steps.apk.outcome != 'success' ||
           steps.package_apk.outcome != 'success' ||
           steps.apk_artifact.outcome != 'success')
        run: exit 1
