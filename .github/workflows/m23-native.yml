name: M23 focused native verification

on:
  push:
    branches: [codex/m23-unified-games-library]

permissions:
  contents: read

concurrency:
  group: m23-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  library-device:
    if: startsWith(github.event.head_commit.message, 'test(M23):')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 15859902
          packages: platform-tools emulator
      - name: Install the established API-37 toolchain
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1" "system-images;android-37.0;google_apis_ps16k;x86_64" --channel=3
          rustup toolchain install 1.88.0 --profile minimal
          rustup target add --toolchain 1.88.0 aarch64-linux-android x86_64-linux-android
      - uses: gradle/actions/setup-gradle@v4
      - name: Focused public Library verification on the canonical device
        run: |
          set -euo pipefail
          echo "no" | avdmanager create avd --force --name m23-library --package "system-images;android-37.0;google_apis_ps16k;x86_64"
          cat >> "$HOME/.android/avd/m23-library.avd/config.ini" <<'AVD'
          hw.lcd.width=1344
          hw.lcd.height=2992
          hw.lcd.density=489
          showDeviceFrame=no
          AVD
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
          "$ANDROID_HOME/emulator/emulator" -avd m23-library -no-window -no-audio -no-boot-anim -no-snapshot -gpu software -memory 8192 > "$RUNNER_TEMP/m23-emulator.log" 2>&1 &
          emulator_pid=$!
          trap 'kill "$emulator_pid" 2>/dev/null || true' EXIT
          timeout 300 bash -c 'until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = "1" ]; do sleep 2; done'
          adb shell wm size | grep 'Physical size: 1344x2992'
          adb shell wm density | grep 'Physical density: 489'
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 1
          ./gradlew :data-persistence:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=dev.lumenchess.data.persistence.GameLibraryRepositoryTest,dev.lumenchess.data.persistence.Migration2To3Test
          if [ -f app/src/androidTest/java/dev/lumenchess/games/GameLibraryUiTest.kt ]; then
            ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=dev.lumenchess.games.GameLibraryUiTest
          fi
          if [ -f app/src/androidTest/java/dev/lumenchess/games/GameLibraryReviewQaTest.kt ]; then
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -r -e m23LibraryQa true -e class dev.lumenchess.games.GameLibraryReviewQaTest dev.lumenchess.test/androidx.test.runner.AndroidJUnitRunner | tee "$RUNNER_TEMP/m23-native-result.txt"
            grep -Eq '^OK \([1-9][0-9]* tests?\)' "$RUNNER_TEMP/m23-native-result.txt"
            adb pull /sdcard/Android/data/dev.lumenchess/files/m23-library-native/. m23-library-native/
            test -s m23-library-native/board-bounds.json
          fi
      - name: Upload public-only results and native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m23-focused-native-${{ github.sha }}
          path: |
            data-persistence/build/outputs/androidTest-results/
            app/build/outputs/androidTest-results/
            m23-library-native/
            ${{ runner.temp }}/m23-emulator.log
            ${{ runner.temp }}/m23-native-result.txt
          if-no-files-found: warn
          retention-days: 14
