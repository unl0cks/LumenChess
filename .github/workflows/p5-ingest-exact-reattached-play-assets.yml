name: P5 ingest exact reattached Play assets

on:
  push:
    branches:
      - p5-reference-fidelity-visual-identity
    paths:
      - .github/workflows/p5-ingest-exact-reattached-play-assets.yml

permissions:
  contents: write
  statuses: write

jobs:
  ingest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p5-reference-fidelity-visual-identity
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconstruct and commit exact reattached Play hero PNGs
        id: ingest
        continue-on-error: true
        run: |
          set -euo pipefail
          git fetch origin p5-reference-fidelity-visual-identity
          git reset --hard origin/p5-reference-fidelity-visual-identity
          python -m pip install --quiet --disable-pip-version-check pillow==12.3.0 playwright==1.57.0

          PARTS=(
            .github/p5-tmp/cabx-00.txt
            .github/p5-tmp/cabx-01.txt
            .github/p5-tmp/cabx-02.txt
            .github/p5-tmp/cabx-03-0.txt
            .github/p5-tmp/cabx-03-1-0.txt
            .github/p5-tmp/cabx-03-1-1a.txt
            .github/p5-tmp/cabx-03-1-1b.txt
            .github/p5-tmp/cabx-03-1-2.txt
            .github/p5-tmp/cabx-03-1-3.txt
            .github/p5-tmp/cabx-03-2.txt
            .github/p5-tmp/cabx-03-3.txt
            .github/p5-tmp/cabx-04.txt
            .github/p5-tmp/cabx-05.txt
          )
          CABX_XZ_B64="$(cat "${PARTS[@]}")"
          export CABX_XZ_B64
          test "${#CABX_XZ_B64}" -eq 18824
          printf '%s' "$CABX_XZ_B64" | sha256sum | grep -q '^a3bc23d189de224baf98718ad3d9eee43852a741c10a832e600f77b7723eeb6c  -$'

          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import base64, binascii, hashlib, io, lzma, os, struct

          path = Path('app/src/main/assets/play-overview/lumen_play_vs_engine_hero.png')
          xz = base64.b64decode(os.environ['CABX_XZ_B64'])
          assert hashlib.sha256(xz).hexdigest() == 'bb862ca37789cbebd2bfbcc458ff9e22306c23a1fdd8ef00e86f418df8576b6b'
          payload = lzma.decompress(xz)
          assert hashlib.sha256(payload).hexdigest() == '838f0f23db547b6cd3a1321aebe472e2e0d68371191b4af99921654c1bd2b347'
          image = Image.open(path).convert('RGBA')
          encoded = io.BytesIO()
          image.save(encoded, format='PNG', compress_level=6)
          base = encoded.getvalue()
          chunk = (
              struct.pack('>I', len(payload)) + b'caBX' + payload +
              struct.pack('>I', binascii.crc32(b'caBX' + payload) & 0xffffffff)
          )
          exact = base[:33] + chunk + base[33:]
          path.write_bytes(exact)
          assert len(exact) == 1121674
          assert hashlib.sha256(exact).hexdigest() == '43a6accd71c5f9f1bfba552e0c409f5a95f25b1567b617c5c8851b5186d40e00'
          PY

          CHROME_ZIP="$RUNNER_TEMP/chrome-linux64.zip"
          curl --fail --location --retry 3 --retry-all-errors \
            'https://storage.googleapis.com/chrome-for-testing-public/144.0.7559.96/linux64/chrome-linux64.zip' \
            --output "$CHROME_ZIP"
          echo 'ebb811eef0a0206b6f15dbd325840e39331a132399a4e7e0770cbc1624c3bff0  '"$CHROME_ZIP" | sha256sum --check
          unzip -q "$CHROME_ZIP" -d "$RUNNER_TEMP/chrome"
          export CHROME_BIN="$RUNNER_TEMP/chrome/chrome-linux64/chrome"

          python - <<'PY'
          import asyncio, base64, hashlib, os
          from pathlib import Path
          from playwright.async_api import async_playwright

          async def main():
              path = Path('app/src/main/assets/play-overview/lumen_engine_arena_hero.png')
              source = 'data:image/png;base64,' + base64.b64encode(path.read_bytes()).decode()
              async with async_playwright() as p:
                  browser = await p.chromium.launch(
                      headless=True,
                      executable_path=os.environ['CHROME_BIN'],
                      args=['--no-sandbox'],
                  )
                  page = await browser.new_page()
                  await page.set_content('<canvas id="c"></canvas>')
                  encoded = await page.evaluate('''async (src) => {
                      const img = new Image();
                      img.src = src;
                      await img.decode();
                      const canvas = document.getElementById('c');
                      canvas.width = img.naturalWidth;
                      canvas.height = img.naturalHeight;
                      canvas.getContext('2d').drawImage(img, 0, 0);
                      const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
                      const bytes = new Uint8Array(await blob.arrayBuffer());
                      let binary = '';
                      const chunk = 0x8000;
                      for (let i = 0; i < bytes.length; i += chunk) {
                          binary += String.fromCharCode(...bytes.subarray(i, i + chunk));
                      }
                      return btoa(binary);
                  }''', source)
                  await browser.close()
              exact = base64.b64decode(encoded)
              path.write_bytes(exact)
              assert len(exact) == 1756150
              assert hashlib.sha256(exact).hexdigest() == '2554fb301501a9f667652ab0631147bd7b38d868812b2dfecc0ea5bfa0aa12f2'

          asyncio.run(main())
          PY

          cat > "$RUNNER_TEMP/exact.sha256" <<'EOF'
          43a6accd71c5f9f1bfba552e0c409f5a95f25b1567b617c5c8851b5186d40e00  app/src/main/assets/play-overview/lumen_play_vs_engine_hero.png
          2554fb301501a9f667652ab0631147bd7b38d868812b2dfecc0ea5bfa0aa12f2  app/src/main/assets/play-overview/lumen_engine_arena_hero.png
          EOF
          sha256sum --check "$RUNNER_TEMP/exact.sha256"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/assets/play-overview/lumen_play_vs_engine_hero.png \
                  app/src/main/assets/play-overview/lumen_engine_arena_hero.png
          if git diff --cached --quiet; then
            echo 'Exact reattached assets already present'
            exit 0
          fi
          git commit -m 'assets(P5): preserve exact reattached Play hero PNGs [skip ci]'
          git pull --rebase origin p5-reference-fidelity-visual-identity
          git push origin HEAD:p5-reference-fidelity-visual-identity
      - name: Publish exact asset ingest status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.ingest.outcome }}
        run: |
          set -euo pipefail
          STATE=failure
          DESCRIPTION='Exact reattached Play hero asset reconstruction failed'
          if [ "$OUTCOME" = success ]; then
            STATE=success
            DESCRIPTION='Exact reattached Play hero PNG bytes committed'
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$STATE" \
            -f context='P5 exact asset ingest' \
            -f description="$DESCRIPTION" \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
      - name: Fail when exact asset ingest failed
        if: steps.ingest.outcome != 'success'
        run: exit 1
