name: P5 selected-face fill diagnostic

on:
  push:
    branches:
      - p5-reference-fidelity-visual-identity
    paths:
      - '.github/workflows/p5-selected-fill-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  selected-fill-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Mark selected-fill diagnostic pending
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context='P5 selected-fill diagnostic' \
            -f description='Opaque precomposited selected-face fill isolation is running' \
            -f target_url="$RUN_URL"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 15859902
          packages: platform-tools emulator

      - name: Install Android 17 emulator and pinned native toolchain
        run: |
          sdkmanager \
            "platforms;android-37.0" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1" \
            "system-images;android-37.0;google_apis_ps16k;x86_64" \
            --channel=3

      - name: Install pinned Rust toolchain for Reckless 0.9.0
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup target add --toolchain 1.88.0 aarch64-linux-android x86_64-linux-android

      - uses: gradle/actions/setup-gradle@v4

      - name: Apply single-variable selected-fill diagnostic
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          path = Path('app/src/main/java/dev/lumenchess/play/ReferenceSetupScreen.kt')
          source = path.read_text()
          old = '''    val top = if (pressed) Color(0xFF2B5665).copy(alpha = .52f) else Color(0xFF336678).copy(alpha = .58f)
              val bottom = if (pressed) Color(0xFF1D3E4A).copy(alpha = .52f) else Color(0xFF204654).copy(alpha = .54f)
              onDrawBehind {
                  if (selected) {
                      drawRoundRect(Brush.verticalGradient(listOf(top, bottom)), cornerRadius = corner)
          '''
          new = '''    val fill = if (pressed) {
                  Brush.verticalGradient(
                      colorStops = arrayOf(
                          0f to Color(0xFF1C343E),
                          .25f to Color(0xFF1B323A),
                          .50f to Color(0xFF192F38),
                          .75f to Color(0xFF172D36),
                          1f to Color(0xFF162A32),
                      ),
                  )
              } else {
                  Brush.verticalGradient(
                      colorStops = arrayOf(
                          0f to Color(0xFF22424E),
                          .25f to Color(0xFF1F3D48),
                          .50f to Color(0xFF1D3843),
                          .75f to Color(0xFF1B343E),
                          1f to Color(0xFF182F39),
                      ),
                  )
              }
              onDrawBehind {
                  if (selected) {
                      drawRoundRect(fill, cornerRadius = corner)
          '''
          if source.count(old) != 1:
              raise SystemExit(f'expected exactly one selected-fill target, found {source.count(old)}')
          patched = source.replace(old, new)
          path.write_text(patched)
          print('patched_sha256=' + hashlib.sha256(patched.encode()).hexdigest())
          PY
          git diff --check
          git diff -- app/src/main/java/dev/lumenchess/play/ReferenceSetupScreen.kt

      - name: Boot Pixel 8 Pro sized Android 17 emulator
        run: |
          echo "no" | avdmanager create avd --force --name p5-selected-fill \
            --package "system-images;android-37.0;google_apis_ps16k;x86_64"
          AVD_CONFIG="$HOME/.android/avd/p5-selected-fill.avd/config.ini"
          cat >> "$AVD_CONFIG" <<'AVDEOF'
          hw.lcd.width=1344
          hw.lcd.height=2992
          hw.lcd.density=489
          showDeviceFrame=no
          AVDEOF
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
          "$ANDROID_HOME/emulator/emulator" -avd p5-selected-fill \
            -no-window -no-audio -no-boot-anim -no-snapshot -gpu software -memory 8192 \
            > "$RUNNER_TEMP/p5-selected-fill-emulator.log" 2>&1 &
          timeout 90 bash -c 'until adb devices | grep -Eq "^emulator-[0-9]+[[:space:]]+device$"; do sleep 2; done'
          timeout 240 bash -c 'until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = "1" ]; do sleep 2; done'
          adb shell wm size reset
          adb shell wm density reset
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0

      - name: Build diagnostic APKs
        run: |
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace

      - name: Capture selected-face diagnostic
        run: |
          adb install -r app/build/outputs/apk/debug/app-debug.apk
          adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          adb shell pm clear dev.lumenchess
          adb shell am instrument -w -r \
            -e p5SetupQa true \
            -e class 'dev.lumenchess.visual.P5SetupScreenshotQaTest#approvedStandardStateCapturesFrozenNewGameAndPressFamilies' \
            dev.lumenchess.test/androidx.test.runner.AndroidJUnitRunner \
            | tee "$RUNNER_TEMP/p5-selected-fill-instrumentation.txt"
          mkdir -p p5-selected-fill
          adb pull /sdcard/Android/data/dev.lumenchess/files/p5-screenshots/. p5-selected-fill/
          test -f p5-selected-fill/02-new-game.png
          test -f p5-selected-fill/02-new-game-press-state.png

      - name: Upload selected-fill diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p5-selected-fill-diagnostic-${{ github.sha }}
          path: |
            p5-selected-fill/
            ${{ runner.temp }}/p5-selected-fill-instrumentation.txt
            ${{ runner.temp }}/p5-selected-fill-emulator.log
            app/src/main/java/dev/lumenchess/play/ReferenceSetupScreen.kt
          if-no-files-found: warn
          retention-days: 7

      - name: Publish selected-fill diagnostic status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          STATE=failure
          DESCRIPTION='Selected-face fill isolation failed'
          if [ "$JOB_STATUS" = 'success' ]; then
            STATE=success
            DESCRIPTION='Selected-face fill isolation captured successfully'
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$STATE" \
            -f context='P5 selected-fill diagnostic' \
            -f description="$DESCRIPTION" \
            -f target_url="$RUN_URL"
