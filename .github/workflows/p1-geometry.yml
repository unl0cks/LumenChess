name: P1 board geometry regression

on:
  push:
    branches:
      - physical-polish-customization

permissions:
  contents: read

jobs:
  geometry-red-green:
    if: >-
      startsWith(github.event.head_commit.message, 'test(P1):') ||
      startsWith(github.event.head_commit.message, 'fix(P1):') ||
      startsWith(github.event.head_commit.message, 'checkpoint(P1):')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 15859902
          packages: platform-tools emulator
      - name: Install Android 17 emulator and pinned native toolchain
        run: |
          sdkmanager \
            "platforms;android-37.0" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1" \
            "system-images;android-37.0;google_apis_ps16k;x86_64" \
            --channel=3
      - name: Install pinned Rust toolchain for Reckless 0.9.0
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup target add --toolchain 1.88.0 aarch64-linux-android x86_64-linux-android
      - uses: gradle/actions/setup-gradle@v4
      - name: Boot Android 17 emulator
        run: |
          echo "no" | avdmanager create avd \
            --force \
            --name p1-geometry \
            --package "system-images;android-37.0;google_apis_ps16k;x86_64"
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
          "$ANDROID_HOME/emulator/emulator" \
            -avd p1-geometry \
            -no-window -no-audio -no-boot-anim -no-snapshot \
            -gpu software -memory 8192 \
            > "$RUNNER_TEMP/p1-emulator.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/p1-emulator.pid"
          timeout 90 bash -c 'until adb devices | grep -Eq "^emulator-[0-9]+[[:space:]]+device$"; do sleep 2; done'
          timeout 240 bash -c 'until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = "1" ]; do sleep 2; done'
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
      - name: Run P1 board geometry regression
        run: |
          ./gradlew :app:connectedDebugAndroidTest \
            -Pandroid.testInstrumentationRunnerArguments.class=dev.lumenchess.play.PlayUiIntegrationTest#boardBoundsStayStableAcrossHumanMoveEngineThinkingAndEngineResult \
            --stacktrace
      - name: Upload emulator diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: p1-geometry-diagnostics
          path: ${{ runner.temp }}/p1-emulator.log
          if-no-files-found: warn
          retention-days: 7
