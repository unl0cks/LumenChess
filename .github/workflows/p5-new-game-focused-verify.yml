name: P5 New Game focused verification

on:
  push:
    branches:
      - p5-reference-fidelity-visual-identity
      - p5-new-game-final-calibration-diagnostic-20260821
    paths:
      - '.github/workflows/p5-new-game-focused-verify.yml'

permissions:
  contents: read
  statuses: write

jobs:
  new-game-focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mark focused verification pending
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context='P5 New Game focused' \
            -f description='New Game rendering, behavior and press QA are running' \
            -f target_url="$RUN_URL"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 15859902
          packages: platform-tools emulator
      - name: Install Android 17 emulator and pinned native toolchain
        run: |
          sdkmanager \
            "platforms;android-37.0" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1" \
            "system-images;android-37.0;google_apis_ps16k;x86_64" \
            --channel=3
      - name: Install pinned Rust toolchain for Reckless 0.9.0
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup target add --toolchain 1.88.0 aarch64-linux-android x86_64-linux-android
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify committed selector source identity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          path = Path('app/src/main/java/dev/lumenchess/play/ReferenceSetupScreen.kt')
          digest = hashlib.sha256(path.read_bytes()).hexdigest()
          expected = '3eb54ee882f175269bacb583a7a2aa25fb7d93089aef8faaa1a4efc54cd648ec'
          if digest != expected:
              raise SystemExit(f'committed selector source hash mismatch: {digest}')
          print('committed_selector_sha256=' + digest)
          PY
      - name: Boot Pixel 8 Pro sized Android 17 emulator
        run: |
          echo "no" | avdmanager create avd --force --name p5-new-game-focused \
            --package "system-images;android-37.0;google_apis_ps16k;x86_64"
          AVD_CONFIG="$HOME/.android/avd/p5-new-game-focused.avd/config.ini"
          cat >> "$AVD_CONFIG" <<'AVDEOF'
          hw.lcd.width=1344
          hw.lcd.height=2992
          hw.lcd.density=489
          showDeviceFrame=no
          AVDEOF
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
          "$ANDROID_HOME/emulator/emulator" -avd p5-new-game-focused \
            -no-window -no-audio -no-boot-anim -no-snapshot -gpu software -memory 8192 \
            > "$RUNNER_TEMP/p5-new-game-focused-emulator.log" 2>&1 &
          timeout 90 bash -c 'until adb devices | grep -Eq "^emulator-[0-9]+[[:space:]]+device$"; do sleep 2; done'
          timeout 240 bash -c 'until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = "1" ]; do sleep 2; done'
          adb shell wm size reset
          adb shell wm density reset
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
      - name: Build focused APKs
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - name: Install focused APKs
        run: |
          adb install -r app/build/outputs/apk/debug/app-debug.apk
          adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
      - name: New Game screenshot and press QA
        run: |
          adb shell pm clear dev.lumenchess
          adb shell am instrument -w -r \
            -e p5SetupQa true \
            -e class 'dev.lumenchess.visual.P5SetupScreenshotQaTest#approvedStandardStateCapturesFrozenNewGameAndPressFamilies' \
            dev.lumenchess.test/androidx.test.runner.AndroidJUnitRunner \
            | tee "$RUNNER_TEMP/p5-new-game-screenshot.txt"
          mkdir -p p5-new-game-focused
          adb pull /sdcard/Android/data/dev.lumenchess/files/p5-screenshots/. p5-new-game-focused/
          test -f p5-new-game-focused/02-new-game.png
          test -f p5-new-game-focused/02-new-game-press-state.png
      - name: New Game state and Chess960 QA
        run: |
          adb shell pm clear dev.lumenchess
          adb shell am instrument -w -r \
            -e p5SetupQa true \
            -e class 'dev.lumenchess.visual.P5SetupScreenshotQaTest#setupControlsRemainStateDrivenAndChess960ConditionalLayoutIsPreserved' \
            dev.lumenchess.test/androidx.test.runner.AndroidJUnitRunner \
            | tee "$RUNNER_TEMP/p5-new-game-state.txt"
      - name: New Game Start to Live QA
        run: |
          adb shell pm clear dev.lumenchess
          adb shell am instrument -w -r \
            -e p5SetupQa true \
            -e class 'dev.lumenchess.visual.P5SetupScreenshotQaTest#standardStartGameStillEntersLiveBoardFirstRoute' \
            dev.lumenchess.test/androidx.test.runner.AndroidJUnitRunner \
            | tee "$RUNNER_TEMP/p5-new-game-live.txt"
      - name: Upload focused verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p5-new-game-focused-${{ github.sha }}
          path: |
            p5-new-game-focused/
            ${{ runner.temp }}/p5-new-game-screenshot.txt
            ${{ runner.temp }}/p5-new-game-state.txt
            ${{ runner.temp }}/p5-new-game-live.txt
          if-no-files-found: warn
          retention-days: 7
      - name: Publish focused verification status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          STATE=failure
          DESCRIPTION='New Game focused verification failed'
          if [ "$JOB_STATUS" = 'success' ]; then
            STATE=success
            DESCRIPTION='New Game rendering, behavior and press QA passed'
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$STATE" \
            -f context='P5 New Game focused' \
            -f description="$DESCRIPTION" \
            -f target_url="$RUN_URL"
