name: APK size report

on:
  push:
    branches:
      - physical-polish-customization
      - main
  pull_request:

permissions:
  contents: read

jobs:
  universal-debug-size:
    if: >-
      github.event_name == 'pull_request' ||
      github.ref == 'refs/heads/main' ||
      startsWith(github.event.head_commit.message, 'checkpoint(P1):') ||
      startsWith(github.event.head_commit.message, 'checkpoint(P2):') ||
      startsWith(github.event.head_commit.message, 'checkpoint(P3):') ||
      startsWith(github.event.head_commit.message, 'checkpoint(P4):')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 15859902
          packages: platform-tools
      - name: Install Android 17 SDK and pinned native toolchain
        run: |
          sdkmanager \
            "platforms;android-37.0" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1" \
            --channel=3
      - name: Install pinned Rust toolchain for Reckless 0.9.0
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup target add --toolchain 1.88.0 aarch64-linux-android x86_64-linux-android
      - uses: gradle/actions/setup-gradle@v4
      - name: Build universal debug APK
        run: ./gradlew :app:assembleDebug
      - name: Report universal debug APK size
        run: |
          apk="$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' | head -n 1)"
          test -n "$apk"
          mkdir -p "$RUNNER_TEMP/apk-size"
          python scripts/report-apk-size.py "$apk" \
            --budget-mib 410 \
            --json-output "$RUNNER_TEMP/apk-size/universal-debug.json" \
            --markdown-output "$RUNNER_TEMP/apk-size/universal-debug.md"
      - name: Upload APK size report
        uses: actions/upload-artifact@v4
        with:
          name: apk-size-universal-${{ github.sha }}
          path: ${{ runner.temp }}/apk-size
          if-no-files-found: error
          retention-days: 30
