name: P5 apply proven selected-fill correction

on:
  push:
    branches:
      - p5-reference-fidelity-visual-identity
    paths:
      - '.github/workflows/p5-apply-selected-fill-fix.yml'

permissions:
  contents: write

jobs:
  apply-selected-fill-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p5-reference-fidelity-visual-identity
          fetch-depth: 0

      - name: Apply exactly the proven selected-face fill
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          path = Path('app/src/main/java/dev/lumenchess/play/ReferenceSetupScreen.kt')
          source = path.read_text()
          old = '''    val top = if (pressed) Color(0xFF2B5665).copy(alpha = .52f) else Color(0xFF336678).copy(alpha = .58f)
              val bottom = if (pressed) Color(0xFF1D3E4A).copy(alpha = .52f) else Color(0xFF204654).copy(alpha = .54f)
              onDrawBehind {
                  if (selected) {
                      drawRoundRect(Brush.verticalGradient(listOf(top, bottom)), cornerRadius = corner)
          '''
          new = '''    val fill = if (pressed) {
                  Brush.verticalGradient(
                      colorStops = arrayOf(
                          0f to Color(0xFF1C343E),
                          .25f to Color(0xFF1B323A),
                          .50f to Color(0xFF192F38),
                          .75f to Color(0xFF172D36),
                          1f to Color(0xFF162A32),
                      ),
                  )
              } else {
                  Brush.verticalGradient(
                      colorStops = arrayOf(
                          0f to Color(0xFF22424E),
                          .25f to Color(0xFF1F3D48),
                          .50f to Color(0xFF1D3843),
                          .75f to Color(0xFF1B343E),
                          1f to Color(0xFF182F39),
                      ),
                  )
              }
              onDrawBehind {
                  if (selected) {
                      drawRoundRect(fill, cornerRadius = corner)
          '''
          if source.count(old) != 1:
              raise SystemExit(f'expected exactly one selected-fill target, found {source.count(old)}')
          patched = source.replace(old, new)
          path.write_text(patched)
          print('patched_sha256=' + hashlib.sha256(patched.encode()).hexdigest())
          PY
          git diff --check
          test "$(git status --short | wc -l | tr -d ' ')" = "1"
          git status --short | grep -Fx ' M app/src/main/java/dev/lumenchess/play/ReferenceSetupScreen.kt'

      - name: Commit proven selected-face correction
        run: |
          git config user.name 'Timeless'
          git config user.email '61148167+unl0cks@users.noreply.github.com'
          git add app/src/main/java/dev/lumenchess/play/ReferenceSetupScreen.kt
          git commit -m 'fix(P5): precompose selected-face fill'
          git push origin HEAD:p5-reference-fidelity-visual-identity
