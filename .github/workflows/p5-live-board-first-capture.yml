name: P5 Live board-first capture

on:
  push:
    branches:
      - p5-live-board-first-reference-diagnostic-20260821
    paths:
      - 'app/src/androidTest/java/dev/lumenchess/visual/P5LiveScreenshotQaTest.kt'
      - '.github/workflows/p5-live-board-first-capture.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-board-first:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 15859902
          packages: platform-tools emulator
      - name: Install Android 17 emulator and pinned native toolchain
        run: |
          sdkmanager \
            "platforms;android-37.0" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1" \
            "system-images;android-37.0;google_apis_ps16k;x86_64" \
            --channel=3
      - name: Install pinned Rust toolchain for Reckless 0.9.0
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup target add --toolchain 1.88.0 aarch64-linux-android x86_64-linux-android
      - uses: gradle/actions/setup-gradle@v4
      - name: Boot Pixel 8 Pro sized Android 17 emulator
        run: |
          echo "no" | avdmanager create avd --force --name p5-live-board-first \
            --package "system-images;android-37.0;google_apis_ps16k;x86_64"
          AVD_CONFIG="$HOME/.android/avd/p5-live-board-first.avd/config.ini"
          cat >> "$AVD_CONFIG" <<'AVDEOF'
          hw.lcd.width=1344
          hw.lcd.height=2992
          hw.lcd.density=489
          showDeviceFrame=no
          AVDEOF
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
          "$ANDROID_HOME/emulator/emulator" -avd p5-live-board-first \
            -no-window -no-audio -no-boot-anim -no-snapshot -gpu software -memory 8192 \
            > "$RUNNER_TEMP/p5-live-board-first-emulator.log" 2>&1 &
          timeout 90 bash -c 'until adb devices | grep -Eq "^emulator-[0-9]+[[:space:]]+device$"; do sleep 2; done'
          timeout 240 bash -c 'until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = "1" ]; do sleep 2; done'
          adb shell wm size reset
          adb shell wm density reset
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
      - name: Build and install focused screenshot APKs
        run: |
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
          adb install -r app/build/outputs/apk/debug/app-debug.apk
          adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
      - name: Capture current board-first Live screen
        run: |
          adb shell pm clear dev.lumenchess
          adb shell am instrument -w -r \
            -e p5LiveQa true \
            -e class 'dev.lumenchess.visual.P5LiveScreenshotQaTest#captureBoardFirstLiveReferenceOnly' \
            dev.lumenchess.test/androidx.test.runner.AndroidJUnitRunner \
            | tee "$RUNNER_TEMP/p5-live-board-first.txt"
          mkdir -p p5-live-board-first
          adb pull /sdcard/Android/data/dev.lumenchess/files/p5-screenshots/. p5-live-board-first/
          test -f p5-live-board-first/03-live-board-first.png
          test -f p5-live-board-first/03-live-board-first-press-state.png
      - name: Upload current board-first evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p5-live-board-first-${{ github.sha }}
          path: |
            p5-live-board-first/
            ${{ runner.temp }}/p5-live-board-first.txt
            ${{ runner.temp }}/p5-live-board-first-emulator.log
          if-no-files-found: warn
          retention-days: 7
