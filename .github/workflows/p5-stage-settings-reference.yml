name: P5 stage approved Settings reference

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stage-reference:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p5-reference-fidelity-visual-identity
          fetch-depth: 0

      - name: Reconstruct and verify approved Iteration 3 Settings reference
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check pillow
          python3 - <<'PY'
          import base64
          import hashlib
          import io
          from pathlib import Path
          from PIL import Image

          root = Path('.')
          prefix = root / 'docs/references/p5'
          paths = [
              prefix / '.settings-iter3-approved-lossless.part00.b64',
              prefix / '.settings-iter3-approved-lossless.part01.b64',
              prefix / '.settings-iter3-approved-lossless.part02.b64',
              prefix / '.settings-iter3-approved-lossless.part03.b64',
              *[prefix / f'.settings-iter3-approved-lossless.part04.{i:02d}.b64' for i in range(6)],
              *[prefix / f'.settings-iter3-approved-lossless.part05.{i:02d}.b64' for i in range(6)],
              prefix / '.settings-iter3-approved-lossless.part06.b64',
          ]
          reference_b64 = ''.join(path.read_text().strip() for path in paths)

          # The durable part07 carrier contains the exact approved 1,352-character
          # tail followed by accidental staging residue. Consume only the verified prefix.
          part07_source = (prefix / '.settings-iter3-approved-lossless.part07.b64').read_text().strip()
          part07 = part07_source[:1352]
          git_blob_sha = hashlib.sha1(f'blob {len(part07)}\0'.encode() + part07.encode()).hexdigest()
          assert git_blob_sha == '7a8556ba779e98e4b83745589706ee3970313500', git_blob_sha
          reference_b64 += part07

          assert len(reference_b64) == 85352, len(reference_b64)
          reference_bytes = base64.b64decode(reference_b64, validate=True)
          assert hashlib.sha256(reference_bytes).hexdigest() == '9fcfa2a94fbcf635c7d5b0dec3c1ae3af955a87377272350f18367c2d2842fca'

          reference = Image.open(io.BytesIO(reference_bytes)).convert('RGB')
          assert reference.size == (390, 844), reference.size
          assert hashlib.sha256(reference.tobytes()).hexdigest() == '791a5d6cac599e83a3083d369b42e2c39b09099cc59033255d6360b0ad906452'

          output = prefix / 'settings-iter3-approved.png'
          reference.save(output, format='PNG', optimize=False)
          assert Image.open(output).convert('RGB').tobytes() == reference.tobytes()
          print(f'Wrote pixel-identical approved Settings reference: {output}')
          PY

      - name: Commit exact approved reference to P5 branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/references/p5/settings-iter3-approved.png
          if git diff --cached --quiet; then
            echo 'Approved reference already staged; nothing to commit.'
            exit 0
          fi
          git commit -m 'chore(P5): stage approved Settings Iteration 3 reference'
          git push origin HEAD:p5-reference-fidelity-visual-identity
